<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GJP Corporation — Acesso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #0a0e14;
      --surface: #111820;
      --border:  #1e3048;
      --accent:  #00d4ff;
      --accent2: #00ff9d;
      --danger:  #ff4c60;
      --text:    #c8d8e8;
      --muted:   #4a6a8a;
      --mono:    'Share Tech Mono', monospace;
      --sans:    'Barlow', sans-serif;
    }
    body.light {
      --bg:      #f0f4f8;
      --surface: #ffffff;
      --border:  #c5d5e8;
      --text:    #1a2a3a;
      --muted:   #6a8aaa;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background .3s, color .3s;
    }

    /* Grade de fundo */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      transition: opacity .3s;
    }
    body.light::before { opacity: .35; }

    /* Glow radial no centro — apenas escuro */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 50% 60%, rgba(0,212,255,.04) 0%, transparent 60%);
      pointer-events: none;
    }
    body.light::after { display: none; }

    /* Toggle tema */
    .theme-btn {
      position: fixed; top: 16px; right: 16px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); width: 34px; height: 30px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 14px; z-index: 10;
      transition: border-color .2s, background .3s;
      border-radius: 2px;
    }
    .theme-btn:hover { border-color: var(--accent); }
    .theme-icon { position: absolute; transition: transform .4s cubic-bezier(.34,1.56,.64,1), opacity .3s; }
    .theme-icon.sun  { transform: translateY(0);    opacity: 1; }
    .theme-icon.moon { transform: translateY(30px); opacity: 0; }
    body.light .theme-icon.sun  { transform: translateY(-30px); opacity: 0; }
    body.light .theme-icon.moon { transform: translateY(0);     opacity: 1; }

    /* Card */
    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      width: min(380px, calc(100vw - 32px));
      padding: 40px 36px;
      animation: fadeUp .45s ease both;
      transition: background .3s, border-color .3s;
      border-radius: 2px;
    }
    /* Cantos decorativos */
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      border-color: var(--accent);
      border-style: solid;
      transition: border-color .3s;
    }
    .card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .card::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    /* Linha de progresso no topo do card — aparece ao submeter */
    .card-progress {
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .5s ease;
      border-radius: 2px 2px 0 0;
      opacity: 0;
    }
    .card-progress.ativo { transform: scaleX(1); opacity: 1; }

    .logo {
      font-family: var(--mono); font-size: 11px;
      color: var(--accent); letter-spacing: 3px;
      text-transform: uppercase; margin-bottom: 8px;
    }
    h1 {
      font-size: 22px; font-weight: 700;
      color: var(--text); margin-bottom: 32px; line-height: 1.2;
      transition: color .3s;
    }
    h1 span { color: var(--accent); }

    .field { margin-bottom: 20px; }
    label {
      display: block; font-family: var(--mono);
      font-size: 10px; letter-spacing: 2px;
      color: var(--muted); text-transform: uppercase; margin-bottom: 8px;
      transition: color .2s;
    }
    /* Label sobe e fica colorida quando o campo tem foco */
    .field:focus-within label { color: var(--accent); }

    /* Wrapper para ícone de visibilidade da senha */
    .input-wrap { position: relative; }
    input {
      width: 100%;
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); font-family: var(--mono); font-size: 14px;
      padding: 12px 14px; outline: none;
      transition: border-color .2s, background .3s, box-shadow .2s;
      border-radius: 2px;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent);
    }
    input::placeholder { color: var(--muted); }
    /* Shake ao errar */
    input.shake {
      animation: shake .35s ease;
      border-color: var(--danger);
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }

    /* Botão olho — mostrar/ocultar senha */
    .btn-eye {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 16px; padding: 4px;
      transition: color .2s; line-height: 1;
    }
    .btn-eye:hover { color: var(--accent); }
    #pass { padding-right: 38px; }

    button.btn-login {
      width: 100%; padding: 14px; margin-top: 8px;
      background: transparent; border: 1px solid var(--accent);
      color: var(--accent); font-family: var(--mono);
      font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
      cursor: pointer; transition: background .2s, color .2s, opacity .2s;
      border-radius: 2px; position: relative; overflow: hidden;
    }
    button.btn-login:hover:not(:disabled) { background: var(--accent); color: var(--bg); }
    button.btn-login:disabled { opacity: .45; cursor: not-allowed; }

    #msg {
      min-height: 20px; margin-top: 16px;
      font-family: var(--mono); font-size: 12px;
      color: var(--danger); text-align: center;
      transition: color .2s;
    }
    #msg.ok { color: var(--accent2); }

    /* Status da API */
    .status-dot {
      display: inline-block; width: 7px; height: 7px;
      border-radius: 50%; background: var(--muted);
      margin-right: 6px; vertical-align: middle;
      transition: background .4s, box-shadow .4s;
    }
    .status-dot.online  { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
    .status-dot.offline { background: var(--danger);  box-shadow: 0 0 6px var(--danger); }

    .api-status {
      margin-top: 24px; padding-top: 16px;
      border-top: 1px solid var(--border);
      font-family: var(--mono); font-size: 11px; color: var(--muted);
      transition: border-color .3s;
      display: flex; align-items: center; gap: 4px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <button class="theme-btn" onclick="toggleTema()" title="Alternar claro/escuro" aria-label="Alternar tema">
    <span class="theme-icon sun">☀️</span>
    <span class="theme-icon moon">🌙</span>
  </button>

  <div class="card">
    <div class="card-progress" id="progress"></div>
    <div class="logo">GJP Corporation // IoT</div>
    <h1>Acesso ao<br><span>Painel de Controle</span></h1>

    <div class="field">
      <label for="user">Usuário</label>
      <input type="text" id="user" placeholder="login"
        autocomplete="username" spellcheck="false">
    </div>

    <div class="field">
      <label for="pass">Senha</label>
      <div class="input-wrap">
        <input type="password" id="pass" placeholder="••••••••"
          autocomplete="current-password">
        <button class="btn-eye" type="button" onclick="toggleSenha(this)"
          aria-label="Mostrar/ocultar senha">👁</button>
      </div>
    </div>

    <button class="btn-login" id="btn" onclick="logar()">Entrar</button>
    <div id="msg" role="alert" aria-live="polite"></div>

    <div class="api-status">
      <span class="status-dot" id="dot"></span>
      <span id="api-txt">verificando API...</span>
    </div>
  </div>

  <script>
    const API = 'http://192.168.1.11:5000'; /*mudar para ip da maquina */

    /* ── Segurança: bloqueia duplo-disparo ── */
    let _loginEmCurso = false;

    /* ── Tema ── */
    function toggleTema() {
      document.body.classList.toggle('light');
      localStorage.setItem('gjp-theme', document.body.classList.contains('light') ? 'light' : 'dark');
    }
    if (localStorage.getItem('gjp-theme') === 'light') {
      document.body.classList.add('light');
    }

    /* ── Mostrar/ocultar senha ── */
    function toggleSenha(btn) {
      const input = document.getElementById('pass');
      const visivel = input.type === 'text';
      input.type = visivel ? 'password' : 'text';
      btn.textContent = visivel ? '👁' : '🙈';
    }

    /* ── Status da API ── */
    let _apiTimer = null;
    async function checarAPI() {
      const dot = document.getElementById('dot');
      const txt = document.getElementById('api-txt');
      try {
        const r = await fetch(`${API}/status`, { signal: AbortSignal.timeout(3000) });
        if (!r.ok) throw new Error('not ok');
        const d = await r.json();
        dot.className = 'status-dot online';
        txt.textContent = `API online · banco: ${d.banco}`;
      } catch {
        dot.className = 'status-dot offline';
        txt.textContent = 'API offline ou sem resposta';
      }
    }

    checarAPI();
    /* Fix bug: guarda referência para cancelar se necessário */
    _apiTimer = setInterval(checarAPI, 10000);

    /* ── Login ── */
    async function logar() {
      /* Bloqueia duplo-disparo */
      if (_loginEmCurso) return;

      const loginEl = document.getElementById('user');
      const senhaEl = document.getElementById('pass');
      const msg     = document.getElementById('msg');
      const btn     = document.getElementById('btn');
      const prog    = document.getElementById('progress');

      const login = loginEl.value.trim();
      const senha = senhaEl.value;

      msg.className = '';
      msg.textContent = '';

      if (!login || !senha) {
        msg.textContent = 'Preencha todos os campos.';
        /* Destaca campo vazio com shake */
        if (!login) _shake(loginEl);
        if (!senha) _shake(senhaEl);
        return;
      }

      _loginEmCurso = true;
      btn.disabled = true;
      btn.textContent = 'Autenticando...';
      prog.classList.add('ativo');

      try {
        const res = await fetch(`${API}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login, senha }),
          signal: AbortSignal.timeout(6000),
        });
        const data = await res.json();

        if (res.ok) {
          sessionStorage.setItem('usuario',       data.nome);
          sessionStorage.setItem('perfil',        data.perfil);
          sessionStorage.setItem('apelido',       data.apelido || '');
          sessionStorage.setItem('login',         login);
          sessionStorage.setItem('session_token', data.session_token);

          msg.className = 'ok';
          msg.textContent = `✓ Bem-vindo, ${data.apelido || data.nome}!`;

          /* Cancela polling da API antes de navegar */
          clearInterval(_apiTimer);
          setTimeout(() => window.location.href = 'dashboard.html', 700);
        } else {
          msg.textContent = data.detail || 'Usuário ou senha inválidos.';
          _shake(senhaEl);
          btn.disabled = false;
          btn.textContent = 'Entrar';
          prog.classList.remove('ativo');
          _loginEmCurso = false;
        }
      } catch (e) {
        const timeout = e.name === 'TimeoutError' || e.name === 'AbortError';
        msg.textContent = timeout ? 'Tempo esgotado. Verifique a API.' : 'API offline ou sem resposta.';
        btn.disabled = false;
        btn.textContent = 'Entrar';
        prog.classList.remove('ativo');
        _loginEmCurso = false;
      }
    }

    function _shake(el) {
      el.classList.remove('shake');
      void el.offsetWidth; /* reflow para reiniciar animação */
      el.classList.add('shake');
      el.addEventListener('animationend', () => el.classList.remove('shake'), { once: true });
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') logar();
    });
  </script>
</body>
</html>
